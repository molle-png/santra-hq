<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santra HQ — Weekly Memo Assistant</title>
<meta name="description" content="Santra HQ — chat-driven weekly memo intake. Five sections, two minutes.">
<meta name="theme-color" content="#0E0E10">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7D2882;
    --purple-light: #9B3AA0;
    --purple-dim: rgba(125,40,130,0.12);
    --bg: #0E0E10;
    --surface: #17171A;
    --surface2: #1F1F23;
    --border: rgba(255,255,255,0.07);
    --text: #F0EEF2;
    --text-sub: #9490A0;
    --text-dim: #5A5665;
    --green: #3D9E6A;
    --green-bg: rgba(61,158,106,0.1);
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 8px var(--purple);
    flex-shrink: 0;
  }
  .header-title { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text-sub); margin-left: auto; font-family: var(--mono); }
  .q2-pills {
    display: flex; gap: 6px; padding: 8px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .pill {
    font-size: 10px; font-family: var(--mono); padding: 3px 9px;
    border-radius: 20px; border: 1px solid var(--purple);
    color: var(--purple-light); background: var(--purple-dim);
  }
  .progress-wrap {
    padding: 10px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .progress-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--purple); border-radius: 2px; transition: width 0.4s ease; }
  .progress-label {
    font-size: 10px; font-family: var(--mono); color: var(--text-dim);
    margin-bottom: 5px; display: flex; justify-content: space-between;
  }
  .chat-area {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 4px; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.bot { align-items: flex-start; }
  .msg.user { align-items: flex-end; }
  .bubble {
    padding: 11px 15px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.6; max-width: 88%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .bot .bubble {
    background: var(--surface2); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; color: var(--text);
  }
  .user .bubble { background: var(--purple); border-bottom-right-radius: 4px; color: white; }
  .sender { font-size: 10px; font-family: var(--mono); color: var(--text-dim); padding: 0 4px; }
  .memo-box {
    background: var(--surface2); border: 1px solid var(--purple);
    border-radius: 12px; padding: 16px; font-family: var(--mono);
    font-size: 11.5px; line-height: 1.75; color: var(--text);
    white-space: pre-wrap; max-width: 88%;
  }
  .memo-header { font-size: 10px; color: var(--purple-light); margin-bottom: 10px; font-family: var(--mono); letter-spacing: 0.08em; }
  .copy-btn {
    margin-top: 10px; background: var(--purple-dim);
    border: 1px solid var(--purple); color: var(--purple-light);
    border-radius: 8px; padding: 7px 14px; font-size: 11px;
    font-family: var(--mono); cursor: pointer; transition: background 0.2s; display: inline-block;
  }
  .copy-btn:hover { background: var(--purple); color: white; }
  .copy-btn.copied { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .typing {
    display: flex; gap: 4px; padding: 14px 15px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content;
  }
  .typing span {
    width: 5px; height: 5px; background: var(--text-sub);
    border-radius: 50%; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0.3; transform: scale(1); }
    40% { opacity: 1; transform: scale(1.2); }
  }
  .input-area {
    padding: 14px 20px; border-top: 1px solid var(--border);
    background: var(--surface); display: flex; gap: 10px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: var(--sans);
    font-size: 13px; padding: 10px 14px; resize: none; outline: none;
    line-height: 1.5; transition: border-color 0.2s; min-height: 42px; max-height: 120px;
  }
  textarea:focus { border-color: var(--purple); }
  textarea::placeholder { color: var(--text-dim); }
  .send-btn {
    background: var(--purple); border: none; border-radius: 10px;
    width: 42px; height: 42px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn svg { width: 16px; height: 16px; fill: white; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .progress-center { max-width: 720px; width: 100%; margin: 0 auto; }
  .input-center { max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-dot"></div>
  <span class="header-title">santra HQ</span>
  <span class="header-sub">Weekly Memo Assistant</span>
</div>

<div class="q2-pills">
  <span class="pill">Q2 2026</span>
  <span class="pill">01 · Close Seed Round</span>
  <span class="pill">02 · +100k MRR</span>
  <span class="pill">03 · Moments by Santra</span>
</div>

<div class="progress-center">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Getting started</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="chat-area" id="chat"></div>

<div class="input-center">
  <div class="input-area">
    <textarea id="input" placeholder="Type your message..." rows="1" aria-label="Message input"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()" aria-label="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
const PROGRESS_LABELS = {
  name_role: 'Introductions',
  get_role: 'Introductions',
  completed: 'Section 1 of 5 — Output this week',
  in_flight: 'Section 2 of 5 — In flight',
  blockers: 'Section 3 of 5 — Blockers',
  q2_seed: 'Section 4 of 5 — Q2 Alignment (1/3)',
  q2_mrr: 'Section 4 of 5 — Q2 Alignment (2/3)',
  q2_moments: 'Section 4 of 5 — Q2 Alignment (3/3)',
  commitments: 'Section 5 of 5 — Next 7 days',
  done: 'Complete ✓',
};
const PROGRESS_PCT = {
  name_role: 5, get_role: 10, completed: 20, in_flight: 35,
  blockers: 50, q2_seed: 62, q2_mrr: 74, q2_moments: 86,
  commitments: 93, done: 100,
};

let state = {
  step: 'name_role', name: '', role: '',
  completed: '', in_flight: '', blockers: '',
  q2_seed: '', q2_mrr: '', q2_moments: '', commitments: '',
};

// ── HQ submit hop (memo → Apps Script → "Santra Weekly Memos" Sheet) ──────
// Set after deploying the Apps Script web app (see cockpit spec
// 2026-05-24-santra-hq-memo-pipeline-design.md). Empty URL = hop disabled,
// page behaves exactly as before (copy → Telegram).
const APPS_SCRIPT_URL = '';
const SUBMIT_TOKEN = '8af9d1ee9447940f84176d51'; // soft anti-spam gate, not a secret

// "4.5 — note text" → { score: "4.5", note: "note text" }; no leading number
// → whole text in score (the cockpit reader extracts the first number).
function splitRating(t) {
  const m = (t || '').trim().match(/^(-?\d+(?:\.\d+)?)\s*[,·\-–—:\/]*\s*([\s\S]*)$/);
  return m ? { score: m[1], note: m[2].trim() } : { score: (t || '').trim(), note: '' };
}

function submitToHQ() {
  if (!APPS_SCRIPT_URL) return Promise.reject(new Error('hop disabled'));
  const seed = splitRating(state.q2_seed);
  const mrr = splitRating(state.q2_mrr);
  const moments = splitRating(state.q2_moments);
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors', // simple request — Apps Script can't answer a preflight
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      token: SUBMIT_TOKEN,
      name: state.name,
      role: state.role,
      output: state.completed,
      in_flight: state.in_flight,
      blockers: state.blockers,
      q2_seed_score: seed.score, q2_seed_note: seed.note,
      q2_mrr_score: mrr.score, q2_mrr_note: mrr.note,
      q2_moments_score: moments.score, q2_moments_note: moments.note,
      next7: state.commitments,
    }),
  });
}

function updateProgress(step) {
  document.getElementById('progress-text').textContent = PROGRESS_LABELS[step] || '';
  const pct = PROGRESS_PCT[step] || 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function getWeekLabel() {
  const d = new Date();
  return 'Week of ' + d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

// Bot messages support a tiny allow-list of inline tags (<b>, <i>) authored
// in this file. User messages are rendered with textContent only. CSS
// white-space:pre-wrap on .bubble handles newlines for both paths.
function renderBotMarkup(target, source) {
  const tokens = source.split(/(<\/?[bi]>)/i);
  const stack = [target];
  for (const tok of tokens) {
    if (!tok) continue;
    const lower = tok.toLowerCase();
    const top = stack[stack.length - 1];
    if (lower === '<b>' || lower === '<i>') {
      const el = document.createElement(lower === '<b>' ? 'b' : 'i');
      top.appendChild(el);
      stack.push(el);
    } else if (lower === '</b>' || lower === '</i>') {
      if (stack.length > 1) stack.pop();
    } else {
      top.appendChild(document.createTextNode(tok));
    }
  }
}

function addMsg(text, who = 'bot') {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg ' + who;
  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.textContent = who === 'bot' ? 'santra HQ' : (state.name || 'You');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (who === 'bot') {
    renderBotMarkup(bubble, text);
  } else {
    bubble.textContent = text;
  }
  msg.appendChild(sender);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing-indicator';
  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.textContent = 'santra HQ';
  const typing = document.createElement('div');
  typing.className = 'typing';
  for (let i = 0; i < 3; i++) typing.appendChild(document.createElement('span'));
  wrap.appendChild(sender);
  wrap.appendChild(typing);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function botReply(text, delay = 600) {
  showTyping();
  setTimeout(() => { removeTyping(); addMsg(text, 'bot'); }, delay);
}

function generateMemo() {
  const fmt = (raw) => raw.split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => l.startsWith('•') || l.match(/^\d+\./) ? l : '• ' + l).join('\n');
  const fmtNum = (raw) => raw.split('\n').map(l => l.trim()).filter(Boolean)
    .map((l, i) => l.match(/^\d+\./) ? l : (i + 1) + '. ' + l).join('\n');

  return `SANTRA WEEKLY MEMO
${state.name} · ${state.role}
${getWeekLabel()}

OUTPUT THIS WEEK
${fmt(state.completed)}

IN FLIGHT
${fmt(state.in_flight)}

BLOCKERS
${state.blockers.toLowerCase().trim() === 'none' ? 'None' : fmt(state.blockers)}

Q2 ALIGNMENT
- Seed Round: ${state.q2_seed}
- +100k MRR: ${state.q2_mrr}
- Moments by Santra: ${state.q2_moments}

NEXT 7 DAYS
${fmtNum(state.commitments)}`;
}

function showMemo(memo) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.textContent = 'santra HQ';
  const box = document.createElement('div');
  box.className = 'memo-box';
  const hdr = document.createElement('div');
  hdr.className = 'memo-header';
  hdr.textContent = '▸ WEEKLY MEMO GENERATED';
  const pre = document.createElement('pre');
  pre.style.cssText = 'font-family:var(--mono);font-size:11.5px;line-height:1.75;white-space:pre-wrap;color:var(--text)';
  pre.textContent = memo;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = '📋 Copy memo';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(memo).then(() => {
      copyBtn.textContent = '✓ Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = '📋 Copy memo'; copyBtn.classList.remove('copied'); }, 2000);
    });
  };
  box.appendChild(hdr);
  box.appendChild(pre);
  box.appendChild(copyBtn);
  wrap.appendChild(sender);
  wrap.appendChild(box);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function advance(input) {
  const step = state.step;

  if (step === 'name_role') {
    const parts = input.split(/,|·|-|\band\b/).map(s => s.trim()).filter(Boolean);
    if (parts.length >= 2) {
      state.name = parts[0];
      state.role = parts.slice(1).join(' ');
      state.step = 'completed';
      updateProgress('completed');
      botReply(`Hey ${state.name} 👋 Let's get your memo done — 2 minutes, 5 questions.\n\n<b>Section 1 of 5:</b> What did you complete or ship this week? Be specific.`);
    } else {
      state.name = input.trim();
      state.step = 'get_role';
      updateProgress('get_role');
      botReply(`Hey ${state.name} 👋 What's your role at santra?`);
    }
    return;
  }

  if (step === 'get_role') {
    state.role = input.trim();
    state.step = 'completed';
    updateProgress('completed');
    botReply(`Perfect. Let's build your memo.\n\n<b>Section 1 of 5:</b> What did you complete or ship this week? Be specific.`);
    return;
  }

  if (step === 'completed') {
    state.completed = input;
    state.step = 'in_flight';
    updateProgress('in_flight');
    botReply(`Noted. <b>Section 2 of 5:</b> What are you actively working on? Include expected completion dates.`);
    return;
  }

  if (step === 'in_flight') {
    state.in_flight = input;
    state.step = 'blockers';
    updateProgress('blockers');
    botReply(`Got it. <b>Section 3 of 5:</b> Any blockers? What's stuck and who needs to act? If none, just say "None".`);
    return;
  }

  if (step === 'blockers') {
    state.blockers = input;
    state.step = 'q2_seed';
    updateProgress('q2_seed');
    botReply(`<b>Section 4 of 5 — Q2 Alignment.</b> Three quick ratings.\n\n🌱 <b>Seed Round:</b> Rate your contribution this week (1–5) and one sentence explaining why.`);
    return;
  }

  if (step === 'q2_seed') {
    state.q2_seed = input;
    state.step = 'q2_mrr';
    updateProgress('q2_mrr');
    botReply(`💰 <b>+100k MRR:</b> Rate your contribution this week (1–5) and one sentence.`);
    return;
  }

  if (step === 'q2_mrr') {
    state.q2_mrr = input;
    state.step = 'q2_moments';
    updateProgress('q2_moments');
    botReply(`✨ <b>Moments by Santra:</b> Rate your contribution this week (1–5) and one sentence.`);
    return;
  }

  if (step === 'q2_moments') {
    state.q2_moments = input;
    state.step = 'commitments';
    updateProgress('commitments');
    botReply(`Last one. <b>Section 5 of 5:</b> Your top 3 commitments for the next 7 days. Number them 1, 2, 3.`);
    return;
  }

  if (step === 'commitments') {
    state.commitments = input;
    state.step = 'done';
    updateProgress('done');
    showTyping();
    setTimeout(() => {
      removeTyping();
      showMemo(generateMemo());
      setTimeout(() => {
        // Auto-submit to HQ; the response is opaque (no-cors) so the success
        // message is optimistic. On rejection (offline / hop disabled) we
        // degrade to today's copy-to-Telegram behavior — a memo is never lost.
        submitToHQ()
          .then(() => addMsg(`✓ Sent to santra HQ — it lands on the cockpit within ~5 minutes. (The copy above is your backup.)`, 'bot'))
          .catch(() => addMsg(`Memo ready. Copy it and send to <b>@molle3x</b> on Telegram.`, 'bot'));
        document.getElementById('input').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('input').placeholder = 'Memo complete. Refresh to start a new one.';
      }, 400);
    }, 800);
  }
}

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || state.step === 'done') return;
  addMsg(text, 'user');
  input.value = '';
  input.style.height = 'auto';
  setTimeout(() => advance(text), 300);
}

document.getElementById('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

window.onload = () => {
  updateProgress('name_role');
  setTimeout(() => {
    addMsg(`Welcome to <b>santra HQ</b>. I'll guide you through your weekly memo in under 2 minutes.\n\nWhat's your name and role? <i>(e.g. "Molla, Business Partner")</i>`, 'bot');
  }, 400);
};
</script>
</body>
</html>
